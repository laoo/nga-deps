name: Build OR-Tools

# A tag is the trigger, because the point of this repository is that a published
# binary is traceable to something written down. workflow_dispatch exists too,
# but it only builds and uploads a workflow artifact -- it never publishes a
# Release, so nothing untraceable can escape.

on:
  push:
    tags: [ 'or-tools-*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'OR-Tools version to build (dry run, publishes no Release)'
        required: true
        default: '9.15'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # The matrix mirrors NGA's own CI, because that is what fixes the ABI.
          # The compiler is in the asset name only on Linux, the one platform
          # where the C++ runtime is not the platform's own.
          - platform: linux-x64-gcc14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            generator: -G Ninja

          - platform: macos-arm64
            os: macos-latest
            generator: -G Ninja
            # Pinned rather than left to the runner: without it the archive
            # silently inherits whatever macOS built it.
            extra: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

          - platform: windows-x64-msvc
            os: windows-latest
            # No generator named, for the same reason NGA's own windows preset
            # names none: windows-latest is the windows-2025-vs2026 image today
            # and was VS 2022 yesterday, so asking for a version is asking to be
            # broken by the runner. CMake picks the Visual Studio that is there,
            # and the MANIFEST records which one it was. That is also why the
            # asset name carries no year -- unlike Linux, the C++ runtime here is
            # the platform's own.
            generator:
            config: --config Release
            # Every configuration /MD, so that NGA's Release build links.
            extra: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and paths
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#or-tools-}"
          else
            version="${{ inputs.version }}"
          fi
          echo "ORTOOLS_VERSION=${version}" >> "$GITHUB_ENV"
          echo "ASSET_NAME=or-tools-${version}-${{ matrix.platform }}" >> "$GITHUB_ENV"

          # GITHUB_WORKSPACE is a backslash path on Windows, which CMake tolerates
          # and find, cp and the rest of these steps do not. cygpath -m gives one
          # form both understand.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "WS=$( cygpath -m "${GITHUB_WORKSPACE}" )" >> "$GITHUB_ENV"
          else
            echo "WS=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          fi

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Check out OR-Tools
        uses: actions/checkout@v5
        with:
          repository: google/or-tools
          ref: v${{ env.ORTOOLS_VERSION }}
          path: or-tools

      - name: Force the dependencies static
        run: ./scripts/patch-static-deps.sh or-tools

      - name: Configure
        run: |
          cmake -S or-tools -B build ${{ matrix.generator }} \
            -C "${WS}/ortools-options.cmake" \
            -DCMAKE_INSTALL_PREFIX="${WS}/install/${ASSET_NAME}" \
            ${{ matrix.extra }}

      - name: Build
        run: cmake --build build ${{ matrix.config }} --parallel

      - name: Install
        run: cmake --install build ${{ matrix.config }}

      - name: Verify nothing shared was installed
        # The first build passed every other check and still shipped 241 shared
        # abseil libraries: OR-Tools' own target honoured BUILD_SHARED_LIBS=OFF
        # while its dependency build did not, and rpath hid it from the consumer
        # check below. This is the assertion that would have caught it.
        run: |
          shared="$( find "${WS}/install/${ASSET_NAME}" \
            \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' -o -name '*.dll' \) -print )"
          if [ -n "${shared}" ]; then
            echo "error: the prefix contains shared libraries:" >&2
            echo "${shared}" >&2
            exit 1
          fi
          echo "static: no shared libraries in the prefix"

      - name: Collect licences and write the manifest
        run: ./scripts/package.sh "${WS}/install/${ASSET_NAME}"

      - name: Verify the prefix is self-contained
        run: |
          cmake -S consumer -B build-consumer ${{ matrix.generator }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${WS}/install/${ASSET_NAME}" \
            ${{ matrix.extra }}
          cmake --build build-consumer ${{ matrix.config }} --parallel
          # The executable sits in a configuration subdirectory under the Visual
          # Studio generator and directly in the build directory under Ninja.
          "$( find build-consumer \( -name consumer -o -name consumer.exe \) -type f | head -1 )"

      - name: Archive
        run: |
          cd install
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a -tzip "${WS}/${ASSET_NAME}.zip" "${ASSET_NAME}"
          else
            tar -czf "${WS}/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
          fi
          ls -l "${WS}/${ASSET_NAME}".*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}.*
          if-no-files-found: error

  release:
    name: Publish the Release
    needs: build
    if: startsWith( github.ref, 'refs/tags/or-tools-' )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Static OR-Tools builds for NGA. See each archive's MANIFEST for the exact upstream commit and CMake configuration." \
            assets/*
